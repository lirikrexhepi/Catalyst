<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Orchestrator Remote</title>
  <style>
    :root {
      --bg: #070a0f;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 16px);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: calc(var(--safe-top) + 8px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(11, 15, 23, 0.85);
      border-bottom: 1px solid var(--card-border);
      z-index: 50;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warning);
      transition: background 0.3s;
      box-shadow: 0 0 8px currentColor;
    }
    .status-dot.online {
      background: var(--success);
    }
    .app-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .project-pill {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 12px;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
    }
    .icon-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.15);
    }
    .nav-tabs {
      display: flex;
      padding: 8px 16px;
      gap: 8px;
      background: rgba(11, 15, 23, 0.5);
      border-bottom: 1px solid var(--card-border);
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg-user {
      align-self: flex-end;
      max-width: 85%;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      padding: 10px 14px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14px;
      line-height: 1.45;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .msg-agent {
      align-self: flex-start;
      max-width: 92%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 18px 18px 18px 4px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .thought-block {
      background: rgba(0, 0, 0, 0.25);
      border-left: 2px solid var(--accent);
      border-radius: 4px 8px 8px 4px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .thought-summary {
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .thought-content {
      margin-top: 6px;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }
    .plan-card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 8px 24px var(--accent-glow);
      border-radius: 16px;
      padding: 14px;
      margin-top: 10px;
    }
    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .plan-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .task-item {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .task-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .task-prompt {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .plan-btn {
      width: 100%;
      margin-top: 8px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #000;
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }
    .plan-btn:active {
      transform: scale(0.98);
    }
    .plan-btn.dispatched {
      background: rgba(52, 211, 153, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
      box-shadow: none;
      cursor: default;
    }
    .agents-deck {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .agent-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .agent-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .agent-title {
      font-size: 14px;
      font-weight: 600;
    }
    .agent-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-running { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .badge-complete { background: rgba(52, 211, 153, 0.15); color: var(--success); }
    .badge-failed { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    .agent-details {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 8px;
    }
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 12px calc(var(--safe-bottom) + 8px);
      background: rgba(11, 15, 23, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }
    .quick-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
    }
    .chip:active { background: rgba(255, 255, 255, 0.12); }
    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    textarea {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      max-height: 110px;
      min-height: 42px;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.09);
    }
    .send-btn {
      background: var(--accent);
      color: #000;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .send-btn:active { transform: scale(0.94); }
    .send-btn.busy {
      background: var(--danger);
      color: #fff;
    }
    /* Auth Modal */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 15, 0.96);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .auth-card h2 { font-size: 18px; color: #fff; }
    .auth-card p { font-size: 13px; color: var(--text-muted); }
    .pin-input {
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-weight: 700;
      outline: none;
      width: 100%;
    }
    .auth-btn {
      background: var(--accent);
      color: #000;
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Pairing / PIN Gate Modal -->
  <div id="authModal" class="auth-overlay" style="display: none;">
    <div class="auth-card">
      <div style="font-size: 36px;">🔐</div>
      <h2>Pair Mobile Device</h2>
      <p>Enter the 6-digit PIN or 256-bit token displayed on your desktop Orchestrator.</p>
      <input type="text" id="pinField" class="pin-input" placeholder="••••••" maxlength="64" autofocus />
      <button class="auth-btn" onclick="submitAuth()">Connect to PC</button>
    </div>
  </div>

  <header>
    <div class="header-left">
      <div id="statusDot" class="status-dot"></div>
      <div class="app-title">
        Orchestrator
        <span id="projectPill" class="project-pill">Loading...</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="New Chat" onclick="handleNewChat()">+</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button id="tabCoordinator" class="tab-btn active" onclick="switchTab('coordinator')">💬 Orchestrator</button>
    <button id="tabAgents" class="tab-btn" onclick="switchTab('agents')">🤖 Agents (<span id="agentsCount">0</span>)</button>
  </div>

  <main id="chatStream">
    <!-- Stream messages appear here -->
  </main>

  <main id="agentsView" style="display: none;">
    <div id="agentsDeck" class="agents-deck">
      <div style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">
        No active agents running on your PC.
      </div>
    </div>
  </main>

  <div class="footer-bar">
    <div class="quick-chips">
      <div class="chip" onclick="quickSend('Audit recent commits and check for errors')">🔍 Audit Commits</div>
      <div class="chip" onclick="quickSend('Run all tests and report results')">🧪 Run Tests</div>
      <div class="chip" onclick="quickSend('Check why the build or dev server is failing')">⚡ Fix Build</div>
      <div class="chip" onclick="quickSend('Summarize progress on current project')">📋 Progress</div>
    </div>
    <div class="input-row">
      <textarea id="promptInput" placeholder="Message Orchestrator from university..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
      <button id="sendBtn" class="send-btn" onclick="handleSend()">↑</button>
    </div>
  </div>

  <script>
    let ws = null;
    let isBusy = false;
    let activeTab = 'coordinator';
    let currentTurnId = null;
    let accumulatedText = '';
    let accumulatedThought = '';
    let currentThoughtEl = null;
    let currentAgentEl = null;

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function setCookie(name, val, days) {
      let expires = "";
      if (days) {
        let d = new Date();
        d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + d.toUTCString();
      }
      document.cookie = name + "=" + (val || "") + expires + "; path=/; SameSite=Lax";
    }

    function getCookie(name) {
      let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }

    // Auto-auth from URL query param
    const tokenFromUrl = getParam('token') || getParam('pin');
    if (tokenFromUrl) {
      setCookie('composer_remote_token', tokenFromUrl, 30);
    }

    function checkAuth() {
      fetch('/api/status')
        .then(res => {
          if (res.status === 401) {
            document.getElementById('authModal').style.display = 'flex';
          } else {
            document.getElementById('authModal').style.display = 'none';
            return res.json();
          }
        })
        .then(data => {
          if (data) {
            document.getElementById('projectPill').textContent = data.project || 'Active';
            document.getElementById('agentsCount').textContent = data.totalAgents || 0;
            connectWebSocket();
            fetchHistory();
            fetchAgents();
          }
        })
        .catch(() => {
          connectWebSocket();
        });
    }

    function submitAuth() {
      const pin = document.getElementById('pinField').value.trim();
      if (!pin) return;
      setCookie('composer_remote_token', pin, 30);
      document.getElementById('authModal').style.display = 'none';
      checkAuth();
    }

    function connectWebSocket() {
      const token = tokenFromUrl || getCookie('composer_remote_token') || '';
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${window.location.host}/api/ws?token=${encodeURIComponent(token)}`;
      
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('statusDot').classList.add('online');
      };

      ws.onclose = () => {
        document.getElementById('statusDot').classList.remove('online');
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          handleServerMessage(msg);
        } catch (err) {
          console.error(err);
        }
      };
    }

    function handleServerMessage(msg) {
      if (msg.type === 'event' && msg.event) {
        handleRuntimeEvent(msg.event);
      } else if (msg.type === 'agents') {
        renderAgents(msg.agents || []);
      } else if (msg.type === 'status') {
        if (msg.status) {
          document.getElementById('projectPill').textContent = msg.status.project || 'Active';
          document.getElementById('agentsCount').textContent = msg.status.totalAgents || 0;
        }
      }
    }

    function handleRuntimeEvent(event) {
      const stream = document.getElementById('chatStream');
      const isCoordinator = event.threadId === 'coordinator';

      if (event.kind === 'agent.thought' && isCoordinator) {
        if (!currentThoughtEl) {
          currentThoughtEl = document.createElement('div');
          currentThoughtEl.className = 'thought-block';
          currentThoughtEl.innerHTML = `
            <div class="thought-summary" onclick="toggleThought(this)">
              <span>💭 Thinking...</span>
            </div>
            <div class="thought-content"></div>
          `;
          stream.appendChild(currentThoughtEl);
        }
        accumulatedThought += event.text || '';
        currentThoughtEl.querySelector('.thought-content').textContent = accumulatedThought;
        scrollDown();
      }

      if (event.kind === 'agent.message' && isCoordinator) {
        if (!currentAgentEl) {
          currentAgentEl = document.createElement('div');
          currentAgentEl.className = 'msg-agent';
          stream.appendChild(currentAgentEl);
        }
        accumulatedText = event.delta ? accumulatedText + event.text : event.text;
        renderMessageWithPlan(currentAgentEl, accumulatedText);
        scrollDown();
      }

      if (event.kind === 'turn.completed' || event.kind === 'turn.failed') {
        isBusy = false;
        updateSendBtn();
        currentThoughtEl = null;
        currentAgentEl = null;
        accumulatedText = '';
        accumulatedThought = '';
        fetchAgents();
      }
    }

    function renderMessageWithPlan(container, text) {
      const taskBlockRegex = /```composer:tasks\s*([\s\S]*?)```/i;
      const match = text.match(taskBlockRegex);

      if (match) {
        const prose = text.replace(taskBlockRegex, '').trim();
        let planHtml = '';
        try {
          const parsed = JSON.parse(match[1]);
          const tasks = parsed.tasks || [];
          planHtml = `
            <div class="plan-card">
              <div class="plan-header">
                <span class="plan-title">⚡ Orchestrator Plan (${tasks.length} tasks)</span>
              </div>
              ${tasks.map((t, idx) => `
                <div class="task-item">
                  <div class="task-title">${idx + 1}. ${escapeHtml(t.title)}</div>
                  <div class="task-prompt">${escapeHtml(t.prompt)}</div>
                </div>
              `).join('')}
              <button class="plan-btn" id="planBtn" onclick="executePlan(${escapeHtml(JSON.stringify(tasks))})">
                🚀 Approve & Start Agents on PC
              </button>
            </div>
          `;
        } catch (e) {}

        container.innerHTML = escapeHtml(prose).replace(/\n/g, '<br>') + planHtml;
      } else {
        container.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
      }
    }

    function executePlan(tasks) {
      const btn = document.getElementById('planBtn');
      if (btn) {
        btn.textContent = '⏳ Spawning Agents...';
        btn.disabled = true;
      }
      sendWs({ action: 'execute_plan', tasks: tasks });
    }

    function handleSend() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;

      if (isBusy) {
        sendWs({ action: 'interrupt_coordinator' });
        return;
      }

      // Add user bubble
      const stream = document.getElementById('chatStream');
      const userEl = document.createElement('div');
      userEl.className = 'msg-user';
      userEl.textContent = text;
      stream.appendChild(userEl);

      input.value = '';
      autoResize(input);
      isBusy = true;
      updateSendBtn();
      scrollDown();

      sendWs({ action: 'send_coordinator', text: text });
    }

    function sendWs(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      }
    }

    function quickSend(text) {
      const input = document.getElementById('promptInput');
      input.value = text;
      handleSend();
    }

    function handleNewChat() {
      if (confirm('Start new chat and stop current running agents?')) {
        sendWs({ action: 'new_chat' });
        document.getElementById('chatStream').innerHTML = '';
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabCoordinator').classList.toggle('active', tab === 'coordinator');
      document.getElementById('tabAgents').classList.toggle('active', tab === 'agents');
      document.getElementById('chatStream').style.display = tab === 'coordinator' ? 'flex' : 'none';
      document.getElementById('agentsView').style.display = tab === 'agents' ? 'flex' : 'none';
      if (tab === 'agents') fetchAgents();
    }

    function fetchHistory() {
      fetch('/api/history')
        .then(r => r.json())
        .then(events => {
          if (Array.isArray(events)) {
            events.forEach(handleRuntimeEvent);
          }
        })
        .catch(() => {});
    }

    function fetchAgents() {
      fetch('/api/agents')
        .then(r => r.json())
        .then(renderAgents)
        .catch(() => {});
    }

    function renderAgents(agents) {
      document.getElementById('agentsCount').textContent = agents.length;
      const container = document.getElementById('agentsDeck');
      if (!agents || agents.length === 0) {
        container.innerHTML = `
          <div style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">
            No active agents running on your PC.
          </div>
        `;
        return;
      }
      container.innerHTML = agents.map(a => `
        <div class="agent-card">
          <div class="agent-card-top">
            <span class="agent-title">${escapeHtml(a.title || a.threadId)}</span>
            <span class="agent-badge badge-${a.state}">${escapeHtml(a.state)}</span>
          </div>
          <div class="agent-details">
            <span>⚙️ ${escapeHtml(a.driver)}</span>
            ${a.branch ? `<span>🌿 ${escapeHtml(a.branch)}</span>` : ''}
            <span>📁 ${escapeHtml(lastSegment(a.cwd))}</span>
          </div>
        </div>
      `).join('');
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    }

    function updateSendBtn() {
      const btn = document.getElementById('sendBtn');
      if (isBusy) {
        btn.textContent = '■';
        btn.classList.add('busy');
      } else {
        btn.textContent = '↑';
        btn.classList.remove('busy');
      }
    }

    function scrollDown() {
      const stream = document.getElementById('chatStream');
      stream.scrollTop = stream.scrollHeight;
    }

    function toggleThought(el) {
      const content = el.nextElementSibling;
      content.style.display = content.style.display === 'none' ? 'block' : 'none';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function lastSegment(path) {
      if (!path) return '';
      const parts = path.split(/[\\/]/);
      return parts[parts.length - 1] || path;
    }

    // Start
    checkAuth();
  </script>
</body>
</html>
