name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Phone app
        working-directory: internal/remote/mobile
        run: |
          npm ci
          npm run build
      - name: Desktop frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
      - run: go vet ./...
      - run: go test ./...
